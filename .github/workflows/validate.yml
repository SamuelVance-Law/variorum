name: Validate

# Runs the validator and the unit tests on every push and pull request.
# Note: on its own this does NOT stop Cloudflare Pages from deploying a
# broken commit. See "Make validation gate the deploy" in the README.

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every work file and the manifest
        run: node tools/validate.mjs
      - name: Unit tests
        run: node --test
